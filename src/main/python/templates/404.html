{% extends "base.html" %}
{% block title %}Página no encontrada | Flask Auth Empleados{% endblock %}

{% block content %}
<section class="single-card-layout">
    <article class="protected-card denied">
        <div class="status-pill error">404</div>
        <h1>Página no encontrada</h1>
        <p>La ruta solicitada no existe en el servicio Flask.</p>
        <a class="btn btn-primary" href="{{ url_for('index') }}">Volver al inicio</a>
    </article>
</section>
{% endblock %}
